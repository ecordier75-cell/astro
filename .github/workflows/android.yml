name: Android APK - Les Astres d'Eric

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Afficher les dossiers du projet
        run: |
          pwd
          find . -maxdepth 5 -name settings.gradle -print
          find . -maxdepth 3 -type d -print
          
      - name: Préparer les communes françaises
        run: python3 scripts/prepare_communes.py
        
      - name: Compiler l'APK
        working-directory: "LesAstresEric-Workflow-APK-Guide/LesAstresEric-Offline"
        run: gradle assembleDebug --no-daemon

      - name: Recuperer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: LesAstresEric-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
